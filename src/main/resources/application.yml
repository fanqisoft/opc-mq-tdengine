spring:
  application:
    name: opc-mq-tdengine

  # Alibaba Druid 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.taosdata.jdbc.rs.RestfulDriver # 使用纯Java RESTful驱动，无需本地动态链接库
    url: jdbc:TAOS-RS://192.168.177.128:6041/iot_data?user=root&password=taosdata&keepColumnName=true
    username: root
    password: taosdata
    druid:
      # 连接池大小配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 获取连接等待超时的时间
      max-wait: 60000
      # 间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      validation-query: select server_status()
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false

# 物联网自定义配置
iot:
  # OPC UA 配置
  opcua:
    server-url: opc.tcp://Coreqi:53530/OPCUA/SimulationServer
    node-id: ns=3;i=1001
    client-name: MiloOPCUAClient

  # MQTT 配置
  mqtt:
    broker-url: tcp://localhost:1883
    username: ""
    password: ""
    topic: iot/opc/simulation/counter
    producer-client-id: opc_producer_client
    consumer-client-id: opc_consumer_client

  # TDengine 写入性能调优配置
  tdengine:
    # 批量写入缓存大小，达到该数量立即触发批量写入
    batch-size: 500
    # 批量写入时间间隔（毫秒），即使未达到批量大小，也会在此间隔后触发写入
    flush-interval-ms: 1000
